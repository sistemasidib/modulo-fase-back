# Credenciais vêm só de variáveis de ambiente — não versionar senhas aqui.
quarkus.http.port=${HTTP_PORT:8000}

# Datasource IDECAN
quarkus.datasource.idecan.db-kind=mssql
quarkus.datasource.idecan.username=${DB_USER_IDECAN}
quarkus.datasource.idecan.password=${DB_PASS_IDECAN}
quarkus.datasource.idecan.jdbc.url=${DB_URL_IDECAN}

# Datasource IDIB
quarkus.datasource.idib.db-kind=mssql
quarkus.datasource.idib.username=${DB_USER_IDIB}
quarkus.datasource.idib.password=${DB_PASS_IDIB}
quarkus.datasource.idib.jdbc.url=${DB_URL_IDIB}

# Persistence units (entidades do sys-core)
quarkus.hibernate-orm.idecan.datasource=idecan
quarkus.hibernate-orm.idecan.packages=br.com.bio.registro.core.runtime.entities.idecan
quarkus.hibernate-orm.idecan.validate-in-dev-mode=false

quarkus.hibernate-orm.idib.datasource=idib
quarkus.hibernate-orm.idib.packages=br.com.bio.registro.core.runtime.entities.idib
quarkus.hibernate-orm.idib.validate-in-dev-mode=false

quarkus.swagger-ui.always-include=true
