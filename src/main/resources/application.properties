# Credenciais vêm só de variáveis de ambiente — não versionar senhas aqui.

# IDECAN
db-user_idecan=${DB_USERNAME_IDECAN}
db-pass_idecan=${DB_PASSWORD_IDECAN}
db-url_idecan=${DB_URL_IDECAN}

# IDIB
db-user_idib=${DB_USERNAME_IDIB}
db-pass_idib=${DB_PASSWORD_IDIB}
db-url_idib=${DB_URL_IDIB}

# ENSALAMENTO
db-user_modulo=${DB_USERNAME}
db-pass_modulo=${DB_PASSWORD}
db-url_modulo=${DB_URL}

quarkus.native.add-all-charsets=true
quarkus.hibernate-orm.validate-in-dev-mode=false
quarkus.hibernate-orm.idecan.validate-in-dev-mode=false
quarkus.hibernate-orm.idib.validate-in-dev-mode=false
quarkus.hibernate-orm.modulo.validate-in-dev-mode=false
quarkus.http.port=8001
quarkus.http.root-path=/data
quarkus.http.limits.max-body-size=150M

smallrye.jwt.sign.algorithm=HS256
smallrye.jwt.sign.key-format=JWK
smallrye.jwt.sign.key={"kty":"oct","k":"bG9jYWwtZGV2LXNlY3JldC1jaGFuZ2UtbWUtcGxlYXNl","alg":"HS256"}
mp.jwt.verify.publickey={"kty":"oct","k":"bG9jYWwtZGV2LXNlY3JldC1jaGFuZ2UtbWUtcGxlYXNl","alg":"HS256"}
smallrye.jwt.verify.key-format=JWK

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.category."org.apache.http".level=WARN
quarkus.log.category."com.amazonaws".level=WARN

# Datasource IDECAN
quarkus.datasource.idecan.db-kind=mssql
quarkus.datasource.idecan.username=${db-user_idecan}
quarkus.datasource.idecan.password=${db-pass_idecan}
quarkus.datasource.idecan.jdbc.url=${db-url_idecan}
quarkus.datasource.idecan.jdbc.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Datasource IDIB
quarkus.datasource.idib.db-kind=mssql
quarkus.datasource.idib.username=${db-user_idib}
quarkus.datasource.idib.password=${db-pass_idib}
quarkus.datasource.idib.jdbc.url=${db-url_idib}
quarkus.datasource.idib.jdbc.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Datasource MODULO (ENSALAMENTO)
quarkus.datasource.modulo.db-kind=mssql
quarkus.datasource.modulo.username=${db-user_modulo}
quarkus.datasource.modulo.password=${db-pass_modulo}
quarkus.datasource.modulo.jdbc.url=${db-url_modulo}
quarkus.datasource.modulo.jdbc.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Datasource TITULOS (MySQL)
quarkus.datasource.titulos.db-kind=mysql
quarkus.datasource.titulos.username=${DB_USERNAME_TITULOS}
quarkus.datasource.titulos.password=${DB_PASSWORD_TITULOS}
quarkus.datasource.titulos.jdbc.url=${DB_URL_TITULOS}
quarkus.datasource.titulos.jdbc.driver=com.mysql.cj.jdbc.Driver

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://concurso.idecan.org.br,https://modulo-dados-api.bioregistro.net.br,https://syspro.bioregistro.net.br,http://localhost:8080,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD
quarkus.http.cors.headers=*
quarkus.http.cors.exposed-headers=*

# ORM IDECAN
quarkus.hibernate-orm.idecan.datasource=idecan
quarkus.hibernate-orm.idecan.packages=br.com.bio.registro.core.runtime.entities.idecan,br.com.bioregistro.dataaccess.Recurso.infra.entity.idecan
quarkus.hibernate-orm.idecan.mapping-files=META-INF/orm-edital-idecan.xml

# ORM IDIB
quarkus.hibernate-orm.idib.datasource=idib
quarkus.hibernate-orm.idib.packages=br.com.bio.registro.core.runtime.entities.idib,br.com.bioregistro.dataaccess.Recurso.infra.entity.idib
quarkus.hibernate-orm.idib.mapping-files=META-INF/orm-edital-idib.xml

# ORM MODULO (ENSALAMENTO)
# Espelho de fase concurso → dbo.fase (id_ref) via Fase.infra.service.ensalamento.EnsalamentoFaseService
ensalamento.api.url=${ENSALAMENTO_API_URL:https://ensalamento-api.bioregistro.net.br}
quarkus.hibernate-orm.modulo.datasource=modulo
quarkus.hibernate-orm.modulo.packages=br.com.bio.registro.core.runtime.entities.modulo
quarkus.hibernate-orm.modulo.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ORM TITULOS
quarkus.hibernate-orm.titulos.datasource=titulos
quarkus.hibernate-orm.titulos.packages=br.com.bio.registro.core.runtime.entities.titulos.dbo

# Desativa a unidade de persistncia default
#NUNCA REMOVER ESSE COMANDO NA LINHA 60
quarkus.hibernate-orm.active=false

# ─────────────────────────────────────────────────────────────────────────────
# S3 – Configuração por cliente
# Defina via variáveis de ambiente em produção.
# ─────────────────────────────────────────────────────────────────────────────

# Idecan
s3.idecan.bucket=${S3_IDECAN_BUCKET:idecanstorage}
s3.idecan.region=${S3_IDECAN_REGION:us-east-1}
s3.idecan.access-key=${S3_IDECAN_ACCESS_KEY}
s3.idecan.secret-key=${S3_IDECAN_SECRET_KEY}
s3.idecan.key-prefix=${S3_IDECAN_PREFIX:idecan-app-files/}

# Idib
s3.idib.bucket=${S3_IDIB_BUCKET:idibstorage}
s3.idib.region=${S3_IDIB_REGION:us-east-1}
s3.idib.access-key=${S3_IDIB_ACCESS_KEY}
s3.idib.secret-key=${S3_IDIB_SECRET_KEY}
s3.idib.key-prefix=${S3_IDIB_PREFIX:idib-app-files/}
